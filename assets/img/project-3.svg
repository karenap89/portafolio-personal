    <rect x="12" y="12" width="14" height="14" rx="3" fill="#c7d2fe" />
    <text x="32" y="24" fill="#3730a3" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Desarrollo NetBeans</text>
    
    <!-- Tarea activa -->
    <rect x="10" y="38" width="148" height="70" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5" />
    <rect x="20" y="48" width="110" height="8" rx="2" fill="#312e81" />
    <rect x="20" y="62" width="128" height="6" rx="2" fill="#4f46e5" />
    <rect x="20" y="74" width="90" height="6" rx="2" fill="#6366f1" />
    <rect x="20" y="88" width="50" height="12" rx="3" fill="#c7d2fe" />

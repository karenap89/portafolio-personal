  <!-- Columna 3 -->
  <g transform="translate(402, 115)">
    <rect x="0" y="0" width="168" height="245" rx="10" fill="#ffffff" stroke="#dcfce7" stroke-width="1.5" />
    <rect x="12" y="12" width="14" height="14" rx="3" fill="#bbf7d0" />
    <text x="32" y="24" fill="#166534" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Puesta a Producción</text>
    
    <!-- Tarea completada -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="pastel-bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfcfd" />
      <stop offset="100%" stop-color="#fff7ed" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="380" rx="16" fill="url(#pastel-bg3)" stroke="#fed7aa" stroke-width="2" />
  
  <!-- Barra de ventana -->
  <rect x="20" y="20" width="560" height="36" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5" />
  <circle cx="45" cy="38" r="6" fill="#fbcfe8" />
  <circle cx="65" cy="38" r="6" fill="#fde68a" />
  <circle cx="85" cy="38" r="6" fill="#bbf7d0" />
  <rect x="115" y="30" width="280" height="16" rx="4" fill="#ffedd5" />
  
  <!-- Header de la app -->
  <text x="35" y="90" fill="#ea580c" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">Plugin Sistema de Ventas - Villa Hermosa</text>
  <rect x="470" y="73" width="90" height="24" rx="6" fill="#fed7aa" />
  <text x="485" y="89" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">+ Producción</text>

  <!-- Columnas Kanban / Flujo Pastel -->
  <!-- Columna 1 -->
  <g transform="translate(30, 115)">
    <rect x="0" y="0" width="168" height="245" rx="10" fill="#ffffff" stroke="#ffedd5" stroke-width="1.5" />
    <rect x="12" y="12" width="14" height="14" rx="3" fill="#fed7aa" />
    <text x="32" y="24" fill="#9a3412" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Requerimientos</text>
    
    <!-- Tarea 1 -->
    <rect x="10" y="38" width="148" height="60" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1" />
    <rect x="20" y="48" width="80" height="8" rx="2" fill="#431407" />
    <rect x="20" y="62" width="128" height="6" rx="2" fill="#c2410c" />
    <rect x="20" y="78" width="45" height="12" rx="3" fill="#fed7aa" />

    <!-- Tarea 2 -->
    <rect x="10" y="106" width="148" height="60" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1" />
    <rect x="20" y="116" width="100" height="8" rx="2" fill="#431407" />
    <rect x="20" y="130" width="110" height="6" rx="2" fill="#c2410c" />

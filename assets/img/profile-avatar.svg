<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8cefa" />
      <stop offset="100%" stop-color="#fcd0dc" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fbcfe8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7864d4" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- Fondo circular con gradiente pastel -->
  <rect width="400" height="400" rx="200" fill="url(#avatar-bg)" />
  
  <g filter="url(#shadow)">
    <!-- Cuerpo / Hombros -->
    <path d="M 100 370 C 100 290 140 260 200 260 C 260 260 300 290 300 370 Z" fill="#475569" />
    <path d="M 160 260 L 200 300 L 240 260 Z" fill="#9d8df1" opacity="0.9" />

    <!-- Cuello -->
    <rect x="175" y="210" width="50" height="60" rx="10" fill="#fed7aa" />
    
    <!-- Cabeza -->
    <ellipse cx="200" cy="170" rx="65" ry="75" fill="url(#skin)" />
    
    <!-- Cabello moderno -->
    <path d="M 130 160 C 130 90 160 80 200 80 C 245 80 270 95 270 150 C 255 130 230 130 200 130 C 160 130 140 145 130 160 Z" fill="#334155" />
    
    <!-- Lentes profesionales -->
    <rect x="150" y="150" width="38" height="28" rx="6" fill="none" stroke="#334155" stroke-width="4" />
    <rect x="212" y="150" width="38" height="28" rx="6" fill="none" stroke="#334155" stroke-width="4" />
    <line x1="188" y1="164" x2="212" y2="164" stroke="#334155" stroke-width="4" />
    <line x1="135" y1="160" x2="150" y2="162" stroke="#334155" stroke-width="3" />
    <line x1="250" y1="162" x2="265" y2="160" stroke="#334155" stroke-width="3" />

    <!-- Ojos dentro de los lentes -->
    <circle cx="169" cy="164" r="3.5" fill="#334155" />
    <circle cx="231" cy="164" r="3.5" fill="#334155" />
    
    <!-- Sonrisa amigable -->
    <path d="M 185 205 Q 200 218 215 205" fill="none" stroke="#e07a93" stroke-width="3.5" stroke-linecap="round" />
  </g>
</svg>

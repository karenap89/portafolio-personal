  <rect x="155" y="65" width="125" height="70" rx="10" fill="#ffffff" stroke="#e8e3f5" stroke-width="1.5" />
  <rect x="170" y="80" width="50" height="8" rx="3" fill="#a79fc2" />
  <rect x="170" y="98" width="70" height="16" rx="4" fill="#9d8df1" />

  <rect x="295" y="65" width="125" height="70" rx="10" fill="#ffffff" stroke="#e8e3f5" stroke-width="1.5" />

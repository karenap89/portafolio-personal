  <text x="175" y="180" fill="#2d2b45" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Flujos BPM & Rendimiento PL/SQL</text>
  
  <!-- Curva del gráfico -->
  <path d="M 180 310 Q 230 240, 280 260 T 380 200 T 480 220 T 550 180" fill="none" stroke="url(#accent-curve)" stroke-width="4" />
  <circle cx="550" cy="180" r="6" fill="#e07a93" />
  

      <stop offset="0%" stop-color="#fdfcfd" />
      <stop offset="100%" stop-color="#f3effc" />
    </linearGradient>
    <linearGradient id="accent-curve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9d8df1" />
      <stop offset="100%" stop-color="#e07a93" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="380" rx="16" fill="url(#pastel-bg1)" stroke="#e8e3f5" stroke-width="2" />
  
  <!-- Barra de ventana del navegador -->
  <rect x="20" y="20" width="560" height="36" rx="8" fill="#ffffff" stroke="#e8e3f5" stroke-width="1.5" />
  <circle cx="45" cy="38" r="6" fill="#fbcfe8" />
  <circle cx="65" cy="38" r="6" fill="#fde68a" />
  <circle cx="85" cy="38" r="6" fill="#bbf7d0" />
  <rect x="115" y="30" width="280" height="16" rx="4" fill="#f3effc" />
  
  <!-- Contenido Mockup BPM & Analítico -->
  <!-- Sidebar -->
  <rect x="20" y="65" width="120" height="295" rx="8" fill="#ffffff" stroke="#e8e3f5" stroke-width="1" />
  <rect x="35" y="90" width="75" height="12" rx="4" fill="#d8cefa" />
  <rect x="35" y="120" width="90" height="8" rx="3" fill="#e8e3f5" />
